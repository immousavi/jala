name: impeccable-design-hook
version: "1.0.0"
description: "دیتکتور طراحی جلا را روی فایل‌های UI که ایجنت می‌نویسد یا وصله اجرا می‌کند و یافته‌ها را به نتیجهٔ ابزار می‌افزاید، تا مدل در گام بعد تصاویر شکسته، شکست‌های کنتراست و فاصله (drift) از سیستم طراحی را درست کند. پیش از پایان نوبت، پاسِ عمیق‌تری روی هر فایل UI لمس‌شده در نشست، باقی‌مانده را پس می‌دهد. فقط جایی اجرا می‌شود که اسکیل jala نصب باشد (.hermes/skills پروژه یا home هِرمس)؛ برای خاموش‌کردنش در یک پروژه، hook.enabled را در .impeccable/config.json روی false بگذار."
provides_hooks:
  - transform_tool_result
  - pre_verify
